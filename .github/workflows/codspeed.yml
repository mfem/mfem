# In this CI section, we build the benchmarks of tests/benchmarks and measure
# them with CodSpeed, which reports the performance changes on pull requests,
# see https://app.codspeed.io/mfem/mfem.
name: "CodSpeed"

permissions:
  contents: read # required by actions/checkout
  id-token: write # required by the OIDC authentication with CodSpeed

on:
  push:
    branches:
      - master
      - next
  pull_request:
  # 'workflow_dispatch' also allows CodSpeed to run backtest performance
  # analysis, in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: checkout mfem
        uses: actions/checkout@v6

      # Restore the compiler cache (ccache). The key embeds the run id, so new
      # runs save a fresh snapshot; the restore-keys prefix warm-starts from the
      # most recent prior run (incl. the base branch for PRs).
      - name: cache ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-codspeed-${{ github.run_id }}
          restore-keys: |
            ccache-codspeed-

      - name: configure ccache
        run: |
          command -v ccache >/dev/null 2>&1 || {
            sudo apt-get update && sudo apt-get install -y ccache
          }
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
          # Ignore header timestamps (restamped by each checkout) so direct mode hits.
          echo "CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros" >> $GITHUB_ENV
          # Hash absolute paths relative to the workspace.
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV

      # 'MFEM_USE_CODSPEED' makes the build use CodSpeed's Google Benchmark
      # compatibility layer, which is fetched by tests/benchmarks/CMakeLists.txt.
      # 'RelWithDebInfo' is used to get optimized benchmarks with the debug
      # symbols needed by the CodSpeed reports.
      - name: configure mfem
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMFEM_USE_BENCHMARK=YES \
            -DMFEM_ENABLE_TESTING=YES \
            -DMFEM_USE_CODSPEED=YES

      - name: build benchmarks
        run: cmake --build build --target benchmarks -j $(nproc)

      - name: ccache stats
        run: ccache -s

      - name: run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: tests/benchmarks/codspeed.sh build/tests/benchmarks
